name: Publish v1.9.1 Detailed Log Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v191-detailed-log.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Build and verify detailed-log release
        run: |
          grep -q "versionCode = 25" app/build.gradle
          grep -q "versionName = '1.9.1-detailed-log'" app/build.gradle
          grep -q "targetApiVersion=102" app/src/main/resources/META-INF/xposed/module.prop
          grep -q 'HOOK_HIT' app/src/main/kotlin/com/op/aod/enhance/hook/HookRuntime.kt
          grep -q 'fun d(event: String, message: String) = write' app/src/main/kotlin/com/op/aod/enhance/hook/AodLog.kt
          test -f tools/capture-aod-log.sh
          test ! -f app/src/main/assets/xposed_init
          ! grep -R -n -E "de\\.robv\\.android\\.xposed|com\\.highcapable\\.yukihookapi|com\\.highcapable\\.kavaref|xposedminversion|xposedmodule" app/src/main app/build.gradle gradle/libs.versions.toml

          mkdir -p /tmp/aod-signing
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -keystore /tmp/aod-signing/release.jks -storepass "$PASS" -keypass "$PASS" -alias aod_release -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=ColorOS AOD Enhance Detailed Log, O=AOD Enhance, C=US"
          {
            echo "storeFile=/tmp/aod-signing/release.jks"
            echo "storePassword=$PASS"
            echo "keyAlias=aod_release"
            echo "keyPassword=$PASS"
          } > keystore.properties

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          kotlin.daemon.jvmargs=-Xmx1g
          EOF

          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=1 clean testDebugUnitTest lintRelease assembleRelease

          APK=app/build/outputs/apk/release/app-arm64-v8a-release.apk
          test -f "$APK"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/SIGNATURE_INFO.txt
          "$BT/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionCode='25'" /tmp/badging.txt
          grep -q "versionName='1.9.1-detailed-log'" /tmp/badging.txt
          unzip -p "$APK" META-INF/xposed/module.prop | grep -q "targetApiVersion=102"
          ENTRY="$(unzip -p "$APK" META-INF/xposed/java_init.list | tr -d '\r\n')"
          test -n "$ENTRY"
          ! unzip -l "$APK" | grep -q "assets/xposed_init"
          ! unzip -l "$APK" | grep -q "lib/armeabi-v7a"
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/dex-strings.txt
          grep -q "HOOK_HIT" /tmp/dex-strings.txt
          grep -q "AOD_Enhance" /tmp/dex-strings.txt
          ! grep -q "de.robv.android.xposed" /tmp/dex-strings.txt
          sha256sum "$APK" | tee /tmp/SHA256SUMS.txt
          cp "$APK" /tmp/ColorOS_AOD_Enhance-v1.9.1-detailed-log-arm64-v8a.apk
          cp tools/capture-aod-log.sh /tmp/capture-aod-log.sh

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.9.1-detailed-log --yes >/dev/null 2>&1 || true
          cat > /tmp/release-notes.md <<'EOF'
          ## ColorOS AOD Enhance v1.9.1 Detailed Log

          面向真机排障的详细日志版本，基于 v1.9.0 libxposed API 102。

          ### 日志增强
          - Release 构建保留 DEBUG / INFO / WARN / ERROR。
          - 每次 libxposed Hook 命中记录 `HOOK_HIT`。
          - 记录模块加载、目标包加载、Hook 注册与异常。
          - 保留亮度原始值/目标值、AOD 时长等现有详细事件。
          - 日志 TAG：`AOD_Enhance`。

          ### 保存为文件
          Release 附带 `capture-aod-log.sh`。root 环境运行后，日志持续保存到：
          `/storage/emulated/0/Documents/ColorOS-AOD/log/`

          示例：
          `su -c 'sh /path/to/capture-aod-log.sh'`

          ### 验收
          - unit test / lintRelease / assembleRelease：通过
          - libxposed API 102 元数据：通过
          - Legacy Xposed/YukiHookAPI 残留检查：通过
          - APK 签名验证：通过
          - ABI：仅 arm64-v8a

          此版本日志量明显高于普通版，定位完问题后建议换回普通稳定版。
          EOF

          gh release create v1.9.1-detailed-log \
            /tmp/ColorOS_AOD_Enhance-v1.9.1-detailed-log-arm64-v8a.apk \
            /tmp/capture-aod-log.sh \
            /tmp/SHA256SUMS.txt \
            /tmp/SIGNATURE_INFO.txt \
            --title "ColorOS AOD Enhance v1.9.1 Detailed Log" \
            --notes-file /tmp/release-notes.md \
            --prerelease
