name: Publish v1.10.0 RC1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v1100-rc1.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Build and verify v1.10.0-rc1
        run: |
          grep -q "versionCode = 28" app/build.gradle
          grep -q "versionName = '1.10.0-rc1'" app/build.gradle
          grep -q "targetApiVersion=102" app/src/main/resources/META-INF/xposed/module.prop
          grep -q '^com.android.systemui$' app/src/main/resources/META-INF/xposed/scope.list
          grep -q '^com.oplus.aod$' app/src/main/resources/META-INF/xposed/scope.list

          test -f app/src/main/kotlin/com/op/aod/enhance/hook/AodDurationController.kt
          test -f app/src/main/kotlin/com/op/aod/enhance/hook/AodDurationPolicy.kt
          test ! -f app/src/main/kotlin/com/op/aod/enhance/hook/AodStateTraceHook.kt
          grep -q 'Panoramic-Aod-Show' app/src/main/kotlin/com/op/aod/enhance/hook/AodDurationController.kt
          grep -q 'requestScreenState' app/src/main/kotlin/com/op/aod/enhance/hook/AodDurationController.kt
          grep -q 'AOD_NATIVE_TIMEOUT_INTERCEPT' app/src/main/kotlin/com/op/aod/enhance/hook/AodDurationController.kt
          grep -q 'AOD_NATIVE_OFF_REPLAY' app/src/main/kotlin/com/op/aod/enhance/hook/AodDurationController.kt
          grep -q 'ELAPSED_REALTIME_WAKEUP' app/src/main/kotlin/com/op/aod/enhance/hook/AodDurationController.kt
          test -f tools/capture-aod-log.sh
          test ! -f app/src/main/assets/xposed_init
          ! grep -R -n -E "de\\.robv\\.android\\.xposed|com\\.highcapable\\.yukihookapi|com\\.highcapable\\.kavaref|xposedminversion|xposedmodule" app/src/main app/build.gradle gradle/libs.versions.toml

          mkdir -p /tmp/aod-signing
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -keystore /tmp/aod-signing/release.jks -storepass "$PASS" -keypass "$PASS" -alias aod_release -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=ColorOS AOD Enhance v1.10 RC1, O=AOD Enhance, C=US"
          {
            echo "storeFile=/tmp/aod-signing/release.jks"
            echo "storePassword=$PASS"
            echo "keyAlias=aod_release"
            echo "keyPassword=$PASS"
          } > keystore.properties

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          kotlin.daemon.jvmargs=-Xmx1g
          EOF

          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=1 clean testDebugUnitTest lintRelease assembleRelease

          APK=app/build/outputs/apk/release/app-arm64-v8a-release.apk
          test -f "$APK"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/SIGNATURE_INFO.txt
          "$BT/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionCode='28'" /tmp/badging.txt
          grep -q "versionName='1.10.0-rc1'" /tmp/badging.txt
          unzip -p "$APK" META-INF/xposed/module.prop | grep -q "targetApiVersion=102"
          unzip -p "$APK" META-INF/xposed/scope.list | grep -q '^com.android.systemui$'
          unzip -p "$APK" META-INF/xposed/scope.list | grep -q '^com.oplus.aod$'
          ENTRY="$(unzip -p "$APK" META-INF/xposed/java_init.list | tr -d '\r\n')"
          test -n "$ENTRY"
          ! unzip -l "$APK" | grep -q "assets/xposed_init"
          ! unzip -l "$APK" | grep -q "lib/armeabi-v7a"
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/dex-strings.txt
          grep -q "Panoramic-Aod-Show" /tmp/dex-strings.txt
          grep -q "AOD_NATIVE_TIMEOUT_INTERCEPT" /tmp/dex-strings.txt
          grep -q "AOD_NATIVE_OFF_REPLAY" /tmp/dex-strings.txt
          ! grep -q "AOD_TRACE_ENTER" /tmp/dex-strings.txt
          ! grep -q "de.robv.android.xposed" /tmp/dex-strings.txt
          sha256sum "$APK" | tee /tmp/SHA256SUMS.txt
          cp "$APK" /tmp/ColorOS_AOD_Enhance-v1.10.0-rc1-arm64-v8a.apk
          cp tools/capture-aod-log.sh /tmp/capture-aod-log.sh

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.10.0-rc1 --yes >/dev/null 2>&1 || true
          cat > /tmp/release-notes.md <<'EOF'
          ## ColorOS AOD Enhance v1.10.0 RC1

          AOD 时长控制子系统重构测试版，基于真机原生状态机追踪结果。

          ### 根因
          ColorOS 全景 AOD 的普通自动超时来自：
          `PanoramicAodController -> AODDisplayUtil.requestScreenState(OFF, 100, "Panoramic-Aod-Show")`。

          ### 新实现
          - 只拦截 `OFF + Panoramic-Aod-Show` 这一条普通自动超时。
          - 系统默认模式完全放行 ColorOS 原逻辑。
          - 30 秒 / 1 分钟 / 5 分钟等模式在原生超时到来时暂缓 OFF。
          - 到目标时间后回放 ColorOS 原生 OFF 请求，而不是直接调用 DreamService.finish。
          - 使用 `ELAPSED_REALTIME_WAKEUP` 精确定时。
          - “始终显示”只屏蔽该普通自动超时。
          - 指纹、解锁、主动唤醒、来电、其他 OFF reason 均不拦截。
          - 恢复亮度、全景、单击屏蔽、低光和 AOD 设置等正常功能 Hook。

          ### 建议真机验证
          1. 先选 1 分钟，进入 AOD 后不要操作，应在约 60 秒才执行原生 OFF。
          2. 再选 30 秒，应在约 30 秒结束。
          3. 选择始终显示后，普通 `Panoramic-Aod-Show` 超时不应熄屏，但正常解锁/唤醒必须仍能退出。

          ### 关键日志
          - `AOD_SESSION_START`
          - `AOD_NATIVE_TIMEOUT_INTERCEPT`
          - `AOD_DEADLINE_SCHEDULE`
          - `AOD_DEADLINE_REACHED`
          - `AOD_NATIVE_OFF_REPLAY`
          - `AOD_SESSION_END`

          这是预发布 RC，请配合 `capture-aod-log.sh` 测试后再升为稳定 v1.10.0。
          EOF

          for attempt in 1 2 3; do
            if gh release create v1.10.0-rc1 \
              /tmp/ColorOS_AOD_Enhance-v1.10.0-rc1-arm64-v8a.apk \
              /tmp/capture-aod-log.sh \
              /tmp/SHA256SUMS.txt \
              /tmp/SIGNATURE_INFO.txt \
              --title "ColorOS AOD Enhance v1.10.0 RC1" \
              --notes-file /tmp/release-notes.md \
              --prerelease; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
