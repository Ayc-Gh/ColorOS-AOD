name: Publish v1.9.2 Duration Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v192-duration-fix.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Build and verify duration-fix release
        run: |
          grep -q "versionCode = 26" app/build.gradle
          grep -q "versionName = '1.9.2-duration-fix'" app/build.gradle
          grep -q "targetApiVersion=102" app/src/main/resources/META-INF/xposed/module.prop
          grep -q 'AOD_DURATION_FINISH_BLOCKED' app/src/main/kotlin/com/op/aod/enhance/hook/AodDurationHook.kt
          grep -q 'AOD_DURATION_NATIVE_HOLD' app/src/main/kotlin/com/op/aod/enhance/hook/AodDurationHook.kt
          grep -q 'ELAPSED_REALTIME_WAKEUP' app/src/main/kotlin/com/op/aod/enhance/hook/AodDurationHook.kt
          test ! -f app/src/main/assets/xposed_init
          ! grep -R -n -E "de\\.robv\\.android\\.xposed|com\\.highcapable\\.yukihookapi|com\\.highcapable\\.kavaref|xposedminversion|xposedmodule" app/src/main app/build.gradle gradle/libs.versions.toml

          mkdir -p /tmp/aod-signing
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -keystore /tmp/aod-signing/release.jks -storepass "$PASS" -keypass "$PASS" -alias aod_release -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=ColorOS AOD Enhance Duration Fix, O=AOD Enhance, C=US"
          {
            echo "storeFile=/tmp/aod-signing/release.jks"
            echo "storePassword=$PASS"
            echo "keyAlias=aod_release"
            echo "keyPassword=$PASS"
          } > keystore.properties

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          kotlin.daemon.jvmargs=-Xmx1g
          EOF

          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=1 clean testDebugUnitTest lintRelease assembleRelease

          APK=app/build/outputs/apk/release/app-arm64-v8a-release.apk
          test -f "$APK"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/SIGNATURE_INFO.txt
          "$BT/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionCode='26'" /tmp/badging.txt
          grep -q "versionName='1.9.2-duration-fix'" /tmp/badging.txt
          unzip -p "$APK" META-INF/xposed/module.prop | grep -q "targetApiVersion=102"
          ENTRY="$(unzip -p "$APK" META-INF/xposed/java_init.list | tr -d '\r\n')"
          test -n "$ENTRY"
          ! unzip -l "$APK" | grep -q "assets/xposed_init"
          ! unzip -l "$APK" | grep -q "lib/armeabi-v7a"
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/dex-strings.txt
          grep -q "AOD_DURATION_FINISH_BLOCKED" /tmp/dex-strings.txt
          grep -q "AOD_DURATION_NATIVE_HOLD" /tmp/dex-strings.txt
          ! grep -q "de.robv.android.xposed" /tmp/dex-strings.txt
          sha256sum "$APK" | tee /tmp/SHA256SUMS.txt
          cp "$APK" /tmp/ColorOS_AOD_Enhance-v1.9.2-duration-fix-arm64-v8a.apk
          cp tools/capture-aod-log.sh /tmp/capture-aod-log.sh

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.9.2-duration-fix --yes >/dev/null 2>&1 || true
          cat > /tmp/release-notes.md <<'EOF'
          ## ColorOS AOD Enhance v1.9.2 Duration Fix

          用于验证 ColorOS 原生 AOD 时长覆盖的新实现。

          ### 时长控制重做
          - 自定义时长不再只是额外上限，而是保护当前 AOD 会话直到目标时间。
          - 拦截当前 DozeService 的提前 `DreamService.finish()`。
          - 在目标时间前保持 AOD 原生 DOZE 状态，避免普通超时提前进入 DOZE_SUSPEND。
          - 使用 `ELAPSED_REALTIME_WAKEUP` 精确定时，解决旧 Handler 在休眠中延迟的问题。
          - 到达目标时间后主动放行结束。
          - 正常唤醒、亮屏、节电模式以及 proximity/pocket/thermal/battery 等安全条件不强制保持。

          ### 建议验证
          1. ColorOS 默认短时 AOD 下选择 30 秒，应约 30 秒结束。
          2. 选择 1 分钟，应不再按系统默认时间提前熄灭，并在约 60 秒结束。
          3. 选择始终显示，普通 ColorOS 超时不应结束 AOD；主动唤醒/解锁应正常退出。

          ### 关键日志
          - `AOD_DURATION_SCHEDULE`
          - `AOD_DURATION_FINISH_BLOCKED`
          - `AOD_DURATION_NATIVE_HOLD`
          - `AOD_DURATION_EXPIRED`

          这是测试预发布版，建议配合 `capture-aod-log.sh` 采集日志。
          EOF

          for attempt in 1 2 3; do
            if gh release create v1.9.2-duration-fix \
              /tmp/ColorOS_AOD_Enhance-v1.9.2-duration-fix-arm64-v8a.apk \
              /tmp/capture-aod-log.sh \
              /tmp/SHA256SUMS.txt \
              /tmp/SIGNATURE_INFO.txt \
              --title "ColorOS AOD Enhance v1.9.2 Duration Fix" \
              --notes-file /tmp/release-notes.md \
              --prerelease; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
