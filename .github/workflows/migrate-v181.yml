name: Migrate and publish v1.8.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/migrate-v181.yml

permissions:
  contents: write

jobs:
  migrate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Fetch source and audited overlays
        run: |
          git clone --depth=1 --branch tmp/aod-v1.8.1-release-build https://github.com/Ayc-Gh/ImageSeek.git /tmp/rebuild
          git clone https://github.com/Qjj7679/ColorOS_Aod_Enhance.git /tmp/aod-src
          cd /tmp/aod-src
          git checkout ef9df74fc8f6d5ae3bc39f35a110047ea8b905c4
          test "$(git rev-parse HEAD)" = "ef9df74fc8f6d5ae3bc39f35a110047ea8b905c4"

      - name: Reconstruct formal v1.8.1 source
        run: |
          cd /tmp/rebuild
          cat aod-ci/patch.part* | tr -d '\r\n' | base64 -d > /tmp/aod-patch.zip
          echo "13ac2880378b7afdfc655639b2e94e282638c01c87ad65173129c285a0e138b6  /tmp/aod-patch.zip" | sha256sum -c -
          unzip -q /tmp/aod-patch.zip -d /tmp/aod-patch

          cat aod-v170-exact/p00_* aod-v170-bridge/overlay.part01 aod-v170-bridge/overlay.part02 aod-v170-bridge/overlay.part03 aod-v170-exact/p04_* | tr -d '\r\n' | base64 -d > /tmp/v170.zip
          echo "a12023d08583aa936aa1ae35402d860e23e179a2dcd6f05b92b13fa553181e94  /tmp/v170.zip" | sha256sum -c -
          unzip -q /tmp/v170.zip -d /tmp/v170

          cp -a /tmp/aod-patch/patch/app/. /tmp/aod-src/app/
          cp -a /tmp/v170/app/. /tmp/aod-src/app/
          rm -f /tmp/aod-src/app/src/debug/AndroidManifest.xml
          rm -f /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/hook/DebugFileLogger.kt
          rm -f /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/data/DebugFileLogStore.kt
          rm -f /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/data/AodConfigProvider.kt
          grep -R -l "DebugFileLogger" /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/hook --include='*.kt' | xargs -r sed -i 's/DebugFileLogger/AodLog/g'

          cp aod-v180/src/AodUiConfig.kt /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/data/
          cp aod-v180/src/AodConfigContract.kt /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/data/
          cp aod-v180/src/AodConfigStore.kt /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/data/
          cp aod-v180/src/AodConfig.kt /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/hook/
          cp aod-v180/src/MainHook.kt /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/hook/
          cp aod-v180/src/AodDurationHook.kt /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/hook/
          cp aod-v180/src/FeaturesActivity.kt /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/ui/

          sed -i "s/versionCode = 21/versionCode = 22/" /tmp/aod-src/app/build.gradle
          sed -i "s/versionName = '1.7.0-debug'/versionName = '1.8.0-debug'/" /tmp/aod-src/app/build.gradle

          python3 aod-v181/apply_release.py

          grep -q "versionCode = 23" /tmp/aod-src/app/build.gradle
          grep -q "versionName = '1.8.1'" /tmp/aod-src/app/build.gradle
          test ! -f /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/hook/AodTelemetry.kt
          ! grep -R -n "AodTelemetry" /tmp/aod-src/app/src/main/kotlin
          ! grep -R -n -E "AodConfigProvider|DebugFileLogger|DebugFileLogStore|MANAGE_EXTERNAL_STORAGE|DEBUG_FILE_LOG" /tmp/aod-src/app/src /tmp/aod-src/app/build.gradle

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Build formal release
        run: |
          mkdir -p /tmp/aod-signing
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -keystore /tmp/aod-signing/release.jks -storepass "$PASS" -keypass "$PASS" -alias aod_release -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=ColorOS AOD Enhance, O=AOD Enhance, C=US"
          {
            echo "storeFile=/tmp/aod-signing/release.jks"
            echo "storePassword=$PASS"
            echo "keyAlias=aod_release"
            echo "keyPassword=$PASS"
          } > /tmp/aod-src/keystore.properties

          cd /tmp/aod-src
          chmod +x gradlew
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          kotlin.daemon.jvmargs=-Xmx1g
          EOF
          ./gradlew --no-daemon --max-workers=1 clean testDebugUnitTest lintRelease assembleRelease

          APK=app/build/outputs/apk/release/app-arm64-v8a-release.apk
          test -f "$APK"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/SIGNATURE_INFO.txt
          "$BT/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionCode='23'" /tmp/badging.txt
          grep -q "versionName='1.8.1'" /tmp/badging.txt
          unzip -p "$APK" assets/xposed_init | grep -q "com.op.aod.enhance.HookEntryXposed"
          ! unzip -l "$APK" | grep -q "lib/armeabi-v7a"
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/dex-strings.txt
          ! grep -q "AodTelemetry" /tmp/dex-strings.txt
          ! grep -q "AOD_TELEMETRY" /tmp/dex-strings.txt
          sha256sum "$APK" > /tmp/SHA256SUMS.txt
          cp "$APK" /tmp/ColorOS_AOD_Enhance-v1.8.1-arm64-v8a.apk

      - name: Commit complete source to new repository
        run: |
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/aod-src/. .
          rm -rf .git
          rm -f keystore.properties
          rm -rf app/build .gradle build

          cat > README.md <<'EOF'
          # ColorOS AOD Enhance

          ColorOS AOD 增强模块，基于 Qjj7679/ColorOS_Aod_Enhance 继续维护。

          ## v1.8.1 正式版

          - 暗光/亮光初始 AOD 亮度支持自定义或系统默认。
          - AOD 自动亮度倍率支持自定义或系统默认。
          - AOD 最长显示时间：系统默认、30 秒、1/5/10/30/60 分钟、始终显示、自定义 1–1440 分钟。
          - 单击防误触，保留双击唤醒。
          - 支持低光/特殊规则下保持 AOD。
          - 配置使用 YukiHookPrefsBridge / XSharedPreferences。
          - 正式版移除 Debug Telemetry、文件日志与公共存储日志权限。
          - 仅提供 arm64-v8a。
          - 不强制修改 LTPO/ADFR min_fps，继续由 ColorOS/面板驱动自动调节。

          ## 安装

          需要兼容的 Xposed/LSPosed 环境。安装 APK 后启用模块并设置对应作用域。

          > v1.8.1 Release 使用新的 Release 证书。如果设备上是签名不同的旧测试版，Android 可能要求先卸载旧版。
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: migrate ColorOS AOD Enhance v1.8.1"
          git push origin HEAD:main

      - name: Publish v1.8.1 release
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          git tag -f v1.8.1
          git push origin v1.8.1 --force
          gh release delete v1.8.1 --yes >/dev/null 2>&1 || true

          cat > /tmp/release-notes.md <<'EOF'
          ## ColorOS AOD Enhance v1.8.1 正式版

          ### 功能
          - AOD 暗光/亮光初始亮度支持自定义或系统默认。
          - AOD 自动亮度倍率支持自定义或系统默认。
          - AOD 最长显示时间支持系统默认、30 秒、1/5/10/30/60 分钟、始终显示和自定义 1–1440 分钟。
          - 单击防误触，双击保持正常。
          - 可选择低光/特殊规则下保持 AOD。
          - 配置通道使用 YukiHookPrefsBridge / XSharedPreferences。

          ### 正式版收口
          - 删除 Debug Telemetry 和周期刷新率/功耗采样。
          - 删除文件日志、ContentProvider 配置链及公共存储日志权限。
          - Release 构建启用 R8 和资源压缩。
          - 仅保留 arm64-v8a。
          - 不写 OPPO ADFR/min_fps，LTPO 继续由系统自动管理。

          ### 验收
          unit test、lintRelease、assembleRelease、APK 签名、Xposed 入口、ABI 与 Debug 残留检查均通过。

          **安装提示：** 如果旧版本签名不同，需要先卸载旧版。
          EOF

          gh release create v1.8.1 /tmp/ColorOS_AOD_Enhance-v1.8.1-arm64-v8a.apk /tmp/SHA256SUMS.txt /tmp/SIGNATURE_INFO.txt --title "ColorOS AOD Enhance v1.8.1" --notes-file /tmp/release-notes.md --latest

# trigger migration
