name: Modern libxposed API CI

on:
  push:
    branches: [modern-libxposed-api-102]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Verify modern module layout
        run: |
          test -f app/src/main/resources/META-INF/xposed/java_init.list
          test -f app/src/main/resources/META-INF/xposed/module.prop
          grep -q 'targetApiVersion=102' app/src/main/resources/META-INF/xposed/module.prop
          ! test -f app/src/main/assets/xposed_init
          ! grep -R -n -E 'de\.robv\.android\.xposed|com\.highcapable\.yukihookapi|xposedminversion|xposedmodule' app/src/main app/build.gradle gradle/libs.versions.toml
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK metadata
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$APK"
          unzip -p "$APK" META-INF/xposed/module.prop | grep -q 'targetApiVersion=102'
          unzip -p "$APK" META-INF/xposed/java_init.list | grep -q 'com.op.aod.enhance.ModuleEntry'
          ! unzip -l "$APK" | grep -q 'assets/xposed_init'
