name: Build and publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    # USB builds are validated and signed locally, then uploaded as release assets.
    if: github.event_name == 'workflow_dispatch' || !endsWith(github.ref_name, '-usb')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Configure stable signing
        env:
          KEYSTORE_BASE64: ${{ secrets.AOD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AOD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AOD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AOD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo 'Tagged releases require the stable AOD signing secrets.' >&2
              exit 1
            fi
            exit 0
          fi
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          keystore = Path(os.environ['RUNNER_TEMP']) / 'aod-release.jks'
          keystore.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64']))
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          values = {'storeFile': str(keystore), 'storePassword': os.environ['STORE_PASSWORD'],
                    'keyAlias': os.environ['KEY_ALIAS'], 'keyPassword': os.environ['KEY_PASSWORD']}
          Path('keystore.properties').write_text(''.join(k + '=' + escape(v) + '\n' for k, v in values.items()))
          PY
      - name: Test and build optimized release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=1 testDebugUnitTest lintRelease assembleRelease
      - name: Verify release metadata and signing
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"
          unzip -p "$APK" META-INF/xposed/module.prop | grep -q 'targetApiVersion=102'
          test -n "$(unzip -p "$APK" META-INF/xposed/java_init.list)"
          ! unzip -l "$APK" | grep -q 'assets/xposed_init'
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/apksigner" verify "$APK"
            VERSION=$("$BT/aapt" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
            test "${GITHUB_REF_NAME#v}" = "$VERSION"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ColorOS-AOD-release
          path: app/build/outputs/apk/release/*.apk
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          gh release create "$GITHUB_REF_NAME" "$APK" --verify-tag --generate-notes --draft
